// ─── Utilities ────────────────────────────────────────────────────────────────
const genId = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => new Date().toISOString().slice(0, 10);

function timeAgo(iso) {
  if (!iso) return '';
  const diff = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (diff === 0) {
    const d = new Date(iso);
    return `오늘 · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  if (diff === 1) return '어제';
  return `${diff}일 전`;
}

function domainOf(url) {
  try { const h = new URL(url).hostname.replace(/^www\./,''); return h.split('.')[0]; }
  catch { return ''; }
}

function makeQuestions(title) {
  return [
    { id: genId(), type: '핵심 요약', q: `"${title}"의 핵심 주장을 한 문장으로 정리하면?` },

  ];
}

function parseTags(str) {
  return str.split(',').map(t => t.trim()).filter(Boolean);

const ALL_CATEGORIES = ['AI','UIUX 디자인','디자인 시스템','커머스 UX','AI 디자인 워크플로우','콘텐츠/크리에이터','뉴스/시장 흐름','디자이너 커리어'];

// ─── State Management ─────────────────────────────────────────────────────────
const STORAGE_KEY = 'readloop_v2';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return { articles: SAMPLE_ARTICLES, sessions: [], streak: 3, lastActiveDate: new Date(Date.now()-86400000).toISOString().slice(0,10) };
}

function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}
}

function reducer(state, action) {
  let next;
  switch (action.type) {
    case 'ADD_ARTICLE': {
      const art = action.article;
      next = { ...state, articles: [art, ...state.articles] };
      break;
    }
    case 'DELETE_ARTICLE': {
      next = { ...state, articles: state.articles.filter(a => a.id !== action.id) };
      break;
    }
    case 'COMPLETE_REVIEW': {
      // results: [{articleId, questionId, rating: 'good'|'again'}]
      const byArticle = {};
      action.results.forEach(r => {
        if (!byArticle[r.articleId]) byArticle[r.articleId] = [];
        byArticle[r.articleId].push(r.rating);
      });
      const articles = state.articles.map(a => {
        const ratings = byArticle[a.id];
        if (!ratings) return a;
        const good = ratings.filter(r => r === 'good').length;
        const ratio = good / ratings.length;
        const newScore = Math.round(a.reviewCount > 0
          ? (a.score * a.reviewCount + ratio * 100) / (a.reviewCount + 1)
          : ratio * 100);
        return { ...a, score: newScore, reviewCount: a.reviewCount + 1, lastReviewedAt: new Date().toISOString() };
      });
      const t = todayStr();
      const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
      const streak = state.lastActiveDate === t ? state.streak
        : state.lastActiveDate === yesterday ? state.streak + 1 : 1;
      const session = { id: genId(), date: new Date().toISOString(), cards: action.results };
      next = { ...state, articles, sessions: [...state.sessions, session], streak, lastActiveDate: t };
      break;
    }
    default: next = state;
  }
  saveState(next);
  return next;
}

// ─── Computed helpers ─────────────────────────────────────────────────────────
function computeStats(articles) {
  const reviewed = articles.filter(a => a.reviewCount > 0);
  const avgScore = reviewed.length ? Math.round(reviewed.reduce((s,a) => s+a.score, 0) / reviewed.length) : 0;
  const weekAgo = Date.now() - 86400000*7;
  const weekArticles = articles.filter(a => new Date(a.savedAt) > weekAgo).length;
  const weekReviewed = reviewed.filter(a => a.lastReviewedAt && new Date(a.lastReviewedAt) > weekAgo).length;
  return { total: articles.length, reviewedCount: reviewed.length, avgScore, weekArticles, weekReviewed };
}

function getTodayCards(articles) {
  const t = todayStr();
  const notToday = articles.filter(a => !a.lastReviewedAt || a.lastReviewedAt.slice(0,10) !== t);
  const sorted = [...notToday].sort((a,b) => {
    if (!a.lastReviewedAt) return -1;
    if (!b.lastReviewedAt) return 1;
    return new Date(a.lastReviewedAt) - new Date(b.lastReviewedAt);
  });
  const cards = [];
  for (const a of sorted) {
    if (cards.length >= 6) break;
    a.questions.forEach(q => { if (cards.length < 6) cards.push({ ...q, articleId: a.id, articleTitle: a.title, summary: a.summary }); });
  }
  return cards;
}

// ─── Primitive Components ─────────────────────────────────────────────────────
function Icon({ name, size=24, color, fill=0, weight=400, style:sx }) {
  return <span className="material-symbols-outlined" style={{ fontSize:size, color, fontVariationSettings:`'FILL' ${fill},'wght' ${weight},'GRAD' 0,'opsz' ${size}`, ...sx }}>{name}</span>;
}

function IconBtn({ name, onClick, color=M3.onSurfaceVar, badge, size=40 }) {
  const [hov, setHov] = useState(false);
  return (
    <button onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ width:size, height:size, borderRadius:'50%', border:0, cursor:'pointer', flexShrink:0,
        background: hov ? 'rgba(29,27,32,0.08)' : 'transparent',
        display:'inline-flex', alignItems:'center', justifyContent:'center', position:'relative' }}>
      <Icon name={name} color={color} size={22} />
      {badge && <span style={{ position:'absolute', top:7, right:7, width:8, height:8, borderRadius:'50%', background:M3.error, border:`2px solid ${M3.surface}` }} />}
    </button>
  );
}

function Btn({ variant='filled', icon, children, onClick, disabled, style:sx, fullWidth }) {
  const [hov, setHov] = useState(false);
  const v = { filled:{bg:M3.primary,fg:M3.onPrimary}, tonal:{bg:M3.secondaryCont,fg:M3.onSecondaryCont},
    outlined:{bg:'transparent',fg:M3.primary,border:`1px solid ${M3.outline}`}, text:{bg:'transparent',fg:M3.primary} }[variant];
  return (
    <button onClick={disabled?undefined:onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ height:40, padding:icon?'0 20px 0 16px':'0 24px', borderRadius:9999,
        border:v.border||0, cursor:disabled?'not-allowed':'pointer',
        background:v.bg, color:v.fg, opacity:disabled?0.4:hov?0.88:1,
        fontFamily:'Roboto,system-ui', fontSize:14, fontWeight:500, letterSpacing:0.1,
        display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8,
        transition:'opacity 0.12s', width:fullWidth?'100%':undefined, ...sx }}>
      {icon && <Icon name={icon} size={18} color="currentColor" />}
      {children}
    </button>
  );
}

function Chip({ selected, onClick, children }) {
  return (
    <button onClick={onClick} style={{ height:32, padding:'0 16px', borderRadius:8, cursor:'pointer',
      border: selected ? 0 : `1px solid ${M3.outlineVar}`,
      background: selected ? M3.secondaryCont : 'transparent',
      color: selected ? M3.onSecondaryCont : M3.onSurfaceVar,
      fontFamily:'Roboto,system-ui', fontSize:14, fontWeight:500,
      display:'inline-flex', alignItems:'center', gap:4, whiteSpace:'nowrap' }}>
      {selected && <Icon name="check" size={16} color="currentColor" />}
      {children}
    </button>
  );
}

function Scrim({ onClick, z=200 }) {
  return <div onClick={onClick} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', zIndex:z }} />;
}

function FormInput({ label, value, onChange, placeholder, multiline, required }) {
  const style = {
    width:'100%', padding:'12px 14px', borderRadius:8, fontSize:14, color:M3.onSurface,
    border:`1px solid ${M3.outlineVar}`, background:M3.surface, outline:'none',
    resize: multiline ? 'vertical' : 'none', fontFamily:'Roboto,system-ui', lineHeight:1.5,
  };
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
      <label style={{ fontSize:12, fontWeight:500, color:M3.onSurfaceVar, letterSpacing:0.4 }}>
        {label}{required && <span style={{ color:M3.error }}> *</span>}
      </label>
      {multiline
        ? <textarea rows={3} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={style} />
        : <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={style} />}
    </div>
  );
}

// ─── Add Article Modal ────────────────────────────────────────────────────────
function AddArticleModal({ onClose, onAdd }) {
  const [title, setTitle] = useState('');
  const [url, setUrl] = useState('');
  const [source, setSource] = useState('');
  const [summary, setSummary] = useState('');
  const [tags, setTags] = useState('');
  const [cats, setCats] = useState([]);

  useEffect(() => {
    if (url) {
      const d = domainOf(url);
      if (d && !source) setSource(d);
    }
  }, [url]);

  const toggleCat = c => setCats(prev => prev.includes(c) ? prev.filter(x=>x!==c) : [...prev, c]);

  const submit = () => {
    if (!title.trim()) return;
    const art = {
      id: genId(), title: title.trim(), url: url.trim(), source: source.trim() || '직접 입력',
      savedAt: new Date().toISOString(), categories: cats, tags: parseTags(tags),
      summary: summary.trim(), score: 0, reviewCount: 0, lastReviewedAt: null,
      questions: makeQuestions(title.trim()),
    };
    onAdd(art);
    onClose();
  };

  return (
    <>
      <Scrim onClick={onClose} z={300} />
      <div className="anim-slide" style={{
        position:'fixed', top:'50%', left:'50%', transform:'translate(-50%,-50%)',
        zIndex:400, width:560, maxWidth:'calc(100vw - 32px)', maxHeight:'90vh',
        background:M3.surface, borderRadius:28, padding:28, display:'flex', flexDirection:'column', gap:20,
        overflow:'auto',
      }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ fontSize:22, fontWeight:500, color:M3.onSurface }}>아티클 추가</div>
          <IconBtn name="close" onClick={onClose} />
        </div>

        <FormInput label="제목" value={title} onChange={setTitle} placeholder="아티클 제목을 입력하세요" required />
        <FormInput label="URL" value={url} onChange={setUrl} placeholder="https://..." />
        <FormInput label="출처" value={source} onChange={setSource} placeholder="서핏, 브런치, 뉴스레터 등" />
        <FormInput label="요약 / 메모" value={summary} onChange={setSummary} placeholder="핵심 내용이나 읽으면서 느낀 점을 적어두세요" multiline />
        <FormInput label="태그 (쉼표로 구분)" value={tags} onChange={setTags} placeholder="디자인 시스템, AI, Figma MCP" />

        <div>
          <div style={{ fontSize:12, fontWeight:500, color:M3.onSurfaceVar, letterSpacing:0.4, marginBottom:8 }}>카테고리</div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
            {ALL_CATEGORIES.map(c => (
              <button key={c} onClick={()=>toggleCat(c)} style={{
                height:30, padding:'0 14px', borderRadius:8, cursor:'pointer', fontSize:13, fontWeight:500,
                border: cats.includes(c) ? 0 : `1px solid ${M3.outlineVar}`,
                background: cats.includes(c) ? M3.primaryCont : 'transparent',
                color: cats.includes(c) ? M3.onPrimaryCont : M3.onSurfaceVar,
              }}>{c}</button>
            ))}
          </div>
        </div>

        <div style={{ display:'flex', gap:8, justifyContent:'flex-end', marginTop:4 }}>
          <Btn variant="text" onClick={onClose}>취소</Btn>
          <Btn variant="filled" icon="add" onClick={submit} disabled={!title.trim()}>저장하기</Btn>
        </div>
      </div>
    </>
  );
}

// ─── Review Session Overlay ───────────────────────────────────────────────────
function ReviewSession({ cards, onClose, onComplete }) {
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('question'); // 'question' | 'rate'
  const [results, setResults] = useState([]);
  const [done, setDone] = useState(false);

  const card = cards[idx];
  const progress = ((idx) / cards.length) * 100;
  const goodCount = results.filter(r=>r.rating==='good').length;

  const reveal = () => setPhase('rate');
  const rate = (rating) => {
    const newResults = [...results, { articleId: card.articleId, questionId: card.id, rating }];
    setResults(newResults);
    if (idx + 1 >= cards.length) {
      setDone(true);
      onComplete(newResults);
    } else {
      setIdx(idx+1);
      setPhase('question');
    }
  };

  if (done) {
    const pct = Math.round((goodCount / cards.length) * 100);
    return (
      <div style={{ position:'fixed', inset:0, zIndex:500, background:M3.primary, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:24 }}>
        <div className="anim-slide" style={{ textAlign:'center', color:M3.onPrimary }}>
          <div style={{ fontSize:56 }}>🎉</div>
          <div style={{ fontSize:28, fontWeight:500, marginTop:16 }}>복습 완료!</div>
          <div style={{ fontSize:16, opacity:0.85, marginTop:8 }}>{cards.length}장 중 {goodCount}장 이해</div>
          <div style={{ fontSize:48, fontWeight:300, marginTop:24, letterSpacing:-1 }}>{pct}점</div>
          <div style={{ fontSize:14, opacity:0.75, marginTop:4 }}>이번 세션 이해도</div>
          <button onClick={onClose} style={{
            marginTop:32, height:48, padding:'0 32px', borderRadius:9999,
            background:M3.onPrimary, color:M3.primary, border:0, cursor:'pointer',
            fontSize:16, fontWeight:500, fontFamily:'Roboto,system-ui',
          }}>완료</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ position:'fixed', inset:0, zIndex:500, background:M3.inverseSurface, display:'flex', flexDirection:'column' }}>
      {/* Header */}
      <div style={{ padding:'16px 24px', display:'flex', alignItems:'center', gap:16 }}>
        <button onClick={onClose} style={{ background:'transparent', border:0, cursor:'pointer', color:M3.inverseOnSurf, display:'flex', alignItems:'center', justifyContent:'center', width:40, height:40, borderRadius:'50%' }}>
          <Icon name="close" size={22} color={M3.inverseOnSurf} />
        </button>
        <div style={{ flex:1, height:4, background:'rgba(255,255,255,0.2)', borderRadius:2, overflow:'hidden' }}>
          <div style={{ height:'100%', width:`${progress}%`, background:M3.inversePrimary, borderRadius:2, transition:'width 0.3s ease' }} />
        </div>
        <div style={{ fontSize:14, color:'rgba(255,255,255,0.7)', minWidth:40, textAlign:'right' }}>{idx+1} / {cards.length}</div>
      </div>

      {/* Card */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 24px 32px' }}>
        <div key={`${idx}-${phase}`} className="anim-flip" style={{
          width:'100%', maxWidth:540, background:M3.surface, borderRadius:24,
          padding:'32px 28px', display:'flex', flexDirection:'column', gap:16,
        }}>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <span style={{ fontSize:11, padding:'3px 10px', borderRadius:6, background:M3.secondaryCont, color:M3.onSecondaryCont, fontWeight:600, letterSpacing:0.4 }}>{card.type}</span>
            <span style={{ fontSize:12, color:M3.onSurfaceVar, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', flex:1 }}>{card.articleTitle}</span>
          </div>

          <div style={{ fontSize:20, lineHeight:'30px', fontWeight:500, color:M3.onSurface }}>{card.q}</div>

          {phase === 'question' && (
            <div style={{ marginTop:8, padding:'12px 14px', borderRadius:10, background:M3.surfContLow, fontSize:13, color:M3.onSurfaceVar }}>
              💭 잠깐 생각해보세요. 준비되면 아래 버튼을 눌러주세요.
            </div>
          )}

          {phase === 'rate' && card.summary && (
            <div style={{ marginTop:8, padding:'14px 16px', borderRadius:12, background:M3.primaryCont, borderLeft:`3px solid ${M3.primary}` }}>
              <div style={{ fontSize:11, fontWeight:600, color:M3.primary, marginBottom:6, letterSpacing:0.4 }}>아티클 핵심 내용</div>
              <div style={{ fontSize:14, lineHeight:'21px', color:M3.onPrimaryCont }}>{card.summary}</div>
            </div>
          )}
        </div>

        {/* Actions */}
        <div style={{ marginTop:24, display:'flex', flexDirection:'column', alignItems:'center', gap:12, width:'100%', maxWidth:540 }}>
          {phase === 'question' ? (
            <button onClick={reveal} style={{
              height:52, padding:'0 40px', borderRadius:9999, border:0, cursor:'pointer',
              background:M3.inversePrimary, color:M3.onPrimaryCont,
              fontSize:16, fontWeight:500, fontFamily:'Roboto,system-ui',
              display:'flex', alignItems:'center', gap:8,
            }}>
              <Icon name="lightbulb" size={20} color={M3.onPrimaryCont} />
              답 확인하기
            </button>
          ) : (
            <div style={{ display:'flex', gap:12, width:'100%' }}>
              <button onClick={()=>rate('again')} style={{
                flex:1, height:52, borderRadius:9999, border:`1px solid rgba(255,255,255,0.3)`,
                cursor:'pointer', background:'transparent', color:M3.inverseOnSurf,
                fontSize:15, fontWeight:500, fontFamily:'Roboto,system-ui',
                display:'flex', alignItems:'center', justifyContent:'center', gap:8,
              }}>
                <Icon name="replay" size={18} color={M3.inverseOnSurf} />
                🔄 다시 볼게
              </button>
              <button onClick={()=>rate('good')} style={{
                flex:1, height:52, borderRadius:9999, border:0,
                cursor:'pointer', background:M3.inversePrimary, color:M3.onPrimaryCont,
                fontSize:15, fontWeight:500, fontFamily:'Roboto,system-ui',
                display:'flex', alignItems:'center', justifyContent:'center', gap:8,
              }}>
                💪 알겠어!
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Search View ──────────────────────────────────────────────────────────────
function SearchView({ articles, onOpenArticle }) {
  const [q, setQ] = useState('');
  const ref = useRef();
  useEffect(() => { ref.current?.focus(); }, []);
  const results = useMemo(() => {
    if (!q.trim()) return [];
    const lower = q.toLowerCase();
    return articles.filter(a =>
      a.title.toLowerCase().includes(lower) ||
      a.summary.toLowerCase().includes(lower) ||
      a.tags.some(t => t.toLowerCase().includes(lower)) ||
      a.categories.some(c => c.toLowerCase().includes(lower)) ||
      a.source.toLowerCase().includes(lower)
    );
  }, [q, articles]);

  return (
    <div style={{ padding:'32px', maxWidth:800 }}>
      <h2 style={{ margin:'0 0 20px', fontSize:24, fontWeight:500, color:M3.onSurface }}>검색</h2>
      <div style={{ display:'flex', alignItems:'center', gap:10, background:M3.surfContHigh, borderRadius:12, padding:'0 16px', height:52, marginBottom:24 }}>
        <Icon name="search" size={22} color={M3.onSurfaceVar} />
        <input ref={ref} value={q} onChange={e=>setQ(e.target.value)}
          placeholder="제목, 요약, 태그, 카테고리로 검색…"
          style={{ flex:1, border:0, background:'transparent', fontSize:16, color:M3.onSurface, outline:'none', fontFamily:'Roboto,system-ui' }} />
        {q && <button onClick={()=>setQ('')} style={{ background:'transparent', border:0, cursor:'pointer', display:'flex', alignItems:'center' }}><Icon name="close" size={18} color={M3.onSurfaceVar} /></button>}
      </div>
      {q && (
        <div style={{ fontSize:13, color:M3.onSurfaceVar, marginBottom:16 }}>
          {results.length > 0 ? `${results.length}개 결과` : '검색 결과가 없어요'}
        </div>
      )}
      <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
        {results.map(a => <ArticleCard key={a.id} a={a} onClick={()=>onOpenArticle(a)} />)}
      </div>
      {!q && (
        <div style={{ textAlign:'center', marginTop:60, color:M3.onSurfaceVar }}>
          <Icon name="manage_search" size={48} color={M3.outlineVar} />
          <div style={{ marginTop:12, fontSize:16 }}>저장한 아티클을 검색해보세요</div>
        </div>
      )}
    </div>
  );
}

// ─── Recap View ───────────────────────────────────────────────────────────────
function RecapView({ articles, sessions, streak }) {
  const stats = computeStats(articles);
  const weekAgo = Date.now() - 86400000*7;
  const weekSessions = sessions.filter(s => new Date(s.date) > weekAgo);
  const topCats = useMemo(() => {
    const cnt = {};
    articles.filter(a => new Date(a.savedAt) > weekAgo).forEach(a => a.categories.forEach(c => { cnt[c] = (cnt[c]||0)+1; }));
    return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>k);
  }, [articles]);

  return (
    <div style={{ padding:'32px', maxWidth:800 }}>
      <h2 style={{ margin:'0 0 24px', fontSize:24, fontWeight:500, color:M3.onSurface }}>이번 주 리캡</h2>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:14, marginBottom:28 }}>
        {[
          { k:'저장한 아티클', v:`${stats.total}개`, sub:`이번 주 +${stats.weekArticles}`, icon:'bookmark', bg:M3.primaryCont, fg:M3.onPrimaryCont },
          { k:'복습 세션', v:`${weekSessions.length}회`, sub:`이번 주`, icon:'auto_stories', bg:M3.secondaryCont, fg:M3.onSecondaryCont },
          { k:'연속 학습', v:`${streak}일`, sub:'🔥 streak', icon:'local_fire_department', bg:M3.tertiaryCont, fg:M3.onTertiaryCont },
          { k:'평균 이해도', v: stats.avgScore > 0 ? `${stats.avgScore}점` : '-', sub:'복습 완료 기준', icon:'insights', bg:M3.surfContHigh, fg:M3.onSurface },
          { k:'복습한 아티클', v:`${stats.reviewedCount}개`, sub:`전체 ${stats.total}개 중`, icon:'check_circle', bg:M3.primaryCont, fg:M3.onPrimaryCont },
          { k:'남은 복습', v:`${stats.total - stats.reviewedCount}개`, sub:'아직 안 읽은 아티클', icon:'pending', bg:M3.surfContHigh, fg:M3.onSurface },
        ].map(s => (
          <div key={s.k} style={{ background:s.bg, color:s.fg, borderRadius:16, padding:16, display:'flex', flexDirection:'column', gap:10 }}>
            <Icon name={s.icon} size={20} color="currentColor" />
            <div style={{ fontSize:26, fontWeight:400, letterSpacing:-0.3 }}>{s.v}</div>
            <div style={{ fontSize:12, opacity:0.85 }}>{s.k} · {s.sub}</div>
          </div>
        ))}
      </div>

      {topCats.length > 0 && (
        <div style={{ marginBottom:24 }}>
          <div style={{ fontSize:14, fontWeight:600, color:M3.onSurfaceVar, letterSpacing:0.8, textTransform:'uppercase', marginBottom:12 }}>이번 주 많이 읽은 카테고리</div>
          <div style={{ display:'flex', gap:8 }}>
            {topCats.map((c,i) => (
              <div key={c} style={{ padding:'8px 16px', borderRadius:10, background:i===0?M3.primary:M3.surfContHigh, color:i===0?M3.onPrimary:M3.onSurface, fontSize:14, fontWeight:500 }}>
                {i===0 && '🏆 '}{c}
              </div>
            ))}
          </div>
        </div>
      )}

      <div>
        <div style={{ fontSize:14, fontWeight:600, color:M3.onSurfaceVar, letterSpacing:0.8, textTransform:'uppercase', marginBottom:12 }}>점수별 아티클</div>
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          {[...articles].filter(a=>a.reviewCount>0).sort((a,b)=>b.score-a.score).slice(0,5).map(a => (
            <div key={a.id} style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 16px', background:M3.surfContLow, borderRadius:12 }}>
              <div style={{ width:40, height:40, borderRadius:10, background: a.score>=80?M3.primaryCont:M3.surfContHigh, display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, fontWeight:600, color: a.score>=80?M3.primary:M3.onSurface, flexShrink:0 }}>{a.score}</div>
              <div style={{ flex:1, fontSize:14, color:M3.onSurface, fontWeight:500 }}>{a.title}</div>
              <div style={{ fontSize:12, color:M3.onSurfaceVar }}>{a.source}</div>
            </div>
          ))}
          {articles.filter(a=>a.reviewCount>0).length === 0 && (
            <div style={{ textAlign:'center', padding:'32px', color:M3.onSurfaceVar }}>아직 복습한 아티클이 없어요</div>
          )}
        </div>
      </div>
    </div>
  );
}

}

// ─── Web Layout ───────────────────────────────────────────────────────────────
function WebApp({ state, dispatch, forceView }) {
  const [activeNav, setActiveNav] = useState('Library');
  const [activeTag, setActiveTag] = useState('all');
  const [showAdd, setShowAdd] = useState(false);
  const [selectedArticle, setSelectedArticle] = useState(null);
  const [reviewSession, setReviewSession] = useState(null);

  const stats = useMemo(() => computeStats(state.articles), [state.articles]);
  const todayCards = useMemo(() => getTodayCards(state.articles), [state.articles]);

  const filtered = useMemo(() => {
    if (activeTag === 'all') return state.articles;
    const label = ALL_CATEGORIES.find(c => c === activeTag);
    return state.articles.filter(a => a.categories.includes(label));
  }, [state.articles, activeTag]);

  const cats = useMemo(() => {
    const used = new Set(state.articles.flatMap(a => a.categories));
    return ALL_CATEGORIES.filter(c => used.has(c));
  }, [state.articles]);

  const startReview = () => {
    const cards = getTodayCards(state.articles);
    if (cards.length) setReviewSession(cards);
  };

  const weekRecap = useMemo(() => {
    const topCats = (() => {
      const cnt = {};
      const wk = Date.now() - 86400000*7;
      state.articles.filter(a=>new Date(a.savedAt)>wk).forEach(a=>a.categories.forEach(c=>{cnt[c]=(cnt[c]||0)+1;}));
      return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>k);
    })();
    const hi = [...state.articles].filter(a=>a.reviewCount>0).sort((a,b)=>b.score-a.score)[0];
    return [
      topCats.length ? `이번 주 가장 많이 읽은 주제: ${topCats[0]}` : '이번 주 아티클을 추가해보세요',
      hi ? `이해도 최고 아티클: "${hi.title.slice(0,20)}…" (${hi.score}점)` : '복습을 시작하면 인사이트가 쌓여요',
      `전체 ${state.articles.length}개 중 ${state.articles.filter(a=>a.reviewCount>0).length}개 복습 완료`,
    ];
  }, [state.articles]);

  return (
    <div style={{ width:'100%', height:'100vh', display:'flex', flexDirection:'column', background:M3.surface, overflow:'hidden' }}>
      {/* Header */}
      <header style={{ height:64, padding:'0 28px', display:'flex', alignItems:'center', gap:16, borderBottom:`1px solid ${M3.outlineVar}`, background:M3.surface, flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:30, height:30, borderRadius:9, background:M3.primary, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <Icon name="autorenew" size={18} color={M3.onPrimary} weight={600} />
          </div>
          <span style={{ fontSize:18, fontWeight:700, color:M3.onSurface, letterSpacing:-0.3 }}>ReadLoop</span>
        </div>
        <nav style={{ display:'flex', gap:2, marginLeft:8 }}>
          {['Library','Review','Search','Recap'].map(n => (
            <button key={n} onClick={()=>setActiveNav(n)} style={{ height:36, padding:'0 16px', borderRadius:9999, border:0, cursor:'pointer', background: activeNav===n?M3.secondaryCont:'transparent', color: activeNav===n?M3.onSecondaryCont:M3.onSurfaceVar, fontFamily:'Roboto,system-ui', fontSize:14, fontWeight:500 }}>
              {n}{n==='Review' && todayCards.length>0 && <span style={{ marginLeft:6, background:M3.primary, color:M3.onPrimary, borderRadius:'50%', width:18, height:18, fontSize:11, display:'inline-flex', alignItems:'center', justifyContent:'center' }}>{todayCards.length}</span>}
            </button>
          ))}
        </nav>
        <div style={{ flex:1 }} />
        <Btn variant="tonal" icon="add" onClick={()=>setShowAdd(true)}>아티클 추가</Btn>
        <div style={{ width:36, height:36, borderRadius:'50%', background:M3.tertiaryCont, color:M3.onTertiaryCont, display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, fontSize:14, flexShrink:0 }}>주</div>
      </header>

      <div style={{ flex:1, display:'flex', overflow:'hidden' }}>
        {/* Main */}
        <main style={{ flex:1, overflow:'auto' }}>
          {activeNav === 'Library' && (
            <div style={{ padding:'28px 28px 56px' }}>
              {/* Hero */}
              <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:20 }}>
                <div>
                  <div style={{ fontSize:14, color:M3.onSurfaceVar }}>안녕하세요 👋</div>
                  <h1 style={{ margin:'4px 0 0', fontSize:30, lineHeight:'38px', fontWeight:400, color:M3.onSurface, letterSpacing:-0.5 }}>
                    {stats.weekArticles > 0 ? <>이번 주 <span style={{ color:M3.primary }}>{stats.weekArticles}개</span> 읽었고,<br />평균 이해도는 <span style={{ color:M3.primary }}>{stats.avgScore > 0 ? `${stats.avgScore}점` : '아직 없어요'}</span></> : <>아티클을 추가하고<br /><span style={{ color:M3.primary }}>복습을 시작</span>해보세요</>}
                  </h1>
                </div>
                <div style={{ display:'flex', gap:8 }}>
                  {todayCards.length > 0 && <Btn variant="tonal" icon="play_arrow" onClick={startReview}>복습 시작</Btn>}
                  <Btn variant="filled" icon="add" onClick={()=>setShowAdd(true)}>아티클 추가</Btn>
                </div>
              </div>
              {/* Stats */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12 }}>
                {[
                  { k:'저장한 아티클', v:`${stats.total}`, sub:`+${stats.weekArticles} 이번 주`, icon:'bookmark', bg:M3.primaryCont, fg:M3.onPrimaryCont },
                  { k:'복습 완료', v:`${stats.reviewedCount}`, sub:`전체 ${stats.total}개 중`, icon:'check_circle', bg:M3.secondaryCont, fg:M3.onSecondaryCont },
                  { k:'평균 이해도', v: stats.avgScore > 0 ? `${stats.avgScore}점` : '-', sub: stats.avgScore > 0 ? '복습 기준' : '복습 후 표시', icon:'insights', bg:M3.tertiaryCont, fg:M3.onTertiaryCont },
                  { k:'연속 학습', v:`${state.streak}일`, sub:'🔥 streak', icon:'local_fire_department', bg:M3.surfContHigh, fg:M3.onSurface },
                ].map(s => (
                  <div key={s.k} style={{ background:s.bg, color:s.fg, borderRadius:16, padding:16, display:'flex', flexDirection:'column', gap:10, minHeight:100 }}>
                    <Icon name={s.icon} size={20} color="currentColor" />
                    <div style={{ marginTop:'auto' }}>
                      <div style={{ fontSize:26, lineHeight:'34px', fontWeight:400, letterSpacing:-0.3 }}>{s.v}</div>
                      <div style={{ fontSize:12, opacity:0.85, marginTop:2 }}>{s.k} · {s.sub}</div>
                    </div>
                  </div>
                ))}
              </div>
              {/* Filters */}
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:32, marginBottom:12 }}>
                <h2 style={{ margin:0, fontSize:20, fontWeight:500, color:M3.onSurface }}>최근 저장한 아티클</h2>
                <span style={{ fontSize:13, color:M3.onSurfaceVar }}>{filtered.length}개</span>
              </div>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:18 }}>
                <Chip selected={activeTag==='all'} onClick={()=>setActiveTag('all')}>전체</Chip>
                {cats.map(c => <Chip key={c} selected={activeTag===c} onClick={()=>setActiveTag(c)}>{c}</Chip>)}
              </div>
              {/* Grid */}
              {filtered.length === 0 ? (
                <div style={{ textAlign:'center', padding:'60px 0', color:M3.onSurfaceVar }}>
                  <Icon name="bookmark_add" size={48} color={M3.outlineVar} />
                  <div style={{ marginTop:12, fontSize:16 }}>아직 아티클이 없어요</div>
                  <div style={{ marginTop:8 }}><Btn variant="tonal" icon="add" onClick={()=>setShowAdd(true)}>첫 아티클 추가하기</Btn></div>
                </div>
              ) : (
                <div className="anim-fade" style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14 }}>

                </div>
              )}
            </div>
          )}
          {activeNav === 'Review' && <ReviewQueueView todayCards={todayCards} onStartReview={startReview} />}
          {activeNav === 'Search' && <SearchView articles={state.articles} onOpenArticle={setSelectedArticle} />}
          {activeNav === 'Recap' && <RecapView articles={state.articles} sessions={state.sessions} streak={state.streak} />}
        </main>
        {/* Sidebar only in Library */}
        {activeNav === 'Library' && (
          <WebSidebar todayCards={todayCards} streak={state.streak} onStartReview={startReview} weekRecap={weekRecap} />
        )}
      </div>

      {/* Modals */}
      {showAdd && <AddArticleModal onClose={()=>setShowAdd(false)} onAdd={art=>dispatch({type:'ADD_ARTICLE',article:art})} />}
      {selectedArticle && <ArticleDetail article={selectedArticle} onClose={()=>setSelectedArticle(null)} onDelete={id=>{dispatch({type:'DELETE_ARTICLE',id});setSelectedArticle(null);}} />}
      {reviewSession && <ReviewSession cards={reviewSession} onClose={()=>setReviewSession(null)} onComplete={results=>{dispatch({type:'COMPLETE_REVIEW',results});setReviewSession(null);}} />}
    </div>
  );
}

// ─── Root ─────────────────────────────────────────────────────────────────────
function App() {
  const [state, dispatch] = useReducer(reducer, null, loadState);
  const [viewMode, setViewMode] = useState('auto');
  const [winW, setWinW] = useState(window.innerWidth);

  useEffect(() => {
    const h = () => setWinW(window.innerWidth);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);

  const isMobile = viewMode === 'mobile' || (viewMode === 'auto' && winW < 768);

  const Toggle = () => (
    <div style={{ position:'fixed', bottom:20, right:20, zIndex:999, display:'flex', gap:6, background:M3.inverseSurface, borderRadius:9999, padding:'6px 10px', boxShadow:'0 4px 16px rgba(0,0,0,0.3)' }}>
      {[{k:'web',icon:'computer'},{k:'mobile',icon:'smartphone'}].map(v => (
        <button key={v.k} onClick={()=>setViewMode(p=>p===v.k?'auto':v.k)} style={{
          display:'flex', alignItems:'center', gap:5, height:30, padding:'0 10px', borderRadius:9999,
          border:0, cursor:'pointer', fontFamily:'Roboto,system-ui', fontSize:12, fontWeight:500,
          background: viewMode===v.k?M3.inversePrimary:'transparent',
          color: viewMode===v.k?M3.onPrimaryCont:M3.inverseOnSurf,
        }}>
          <Icon name={v.icon} size={15} color="currentColor" />{v.k}
        </button>
      ))}
    </div>
  );

  if (!isMobile) {
    return (
      <>
        <div style={{ width:'100%' }}><WebApp state={state} dispatch={dispatch} /></div>
        <Toggle />
      </>
    );
  }

  return (
    <div style={{ width:'100%', minHeight:'100vh', background:'#ECE6F0', display:'flex', alignItems:'center', justifyContent:'center', padding:'24px 16px' }}>
      <MobileApp state={state} dispatch={dispatch} />
      <Toggle />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
